<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>New Year 2026 Countdown</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="container">
    <div class="title">✨ Countdown 2026 ✨</div>

    <div id="countdown" class="countdown">
      <div><span id="days">00</span><label>Días</label></div>
      <div><span id="hours">00</span><label>Horas</label></div>
      <div><span id="minutes">00</span><label>Min</label></div>
      <div><span id="seconds">00</span><label>Seg</label></div>
    </div>

    <div class="leaderboard">
      <div class="lb-title">Top Supporters</div>
      <div id="top-list"></div>
    </div>
  </div>

  <audio id="mvpSound" src="mvp.mp3"></audio>

  <script src="script.js"></script>
</body>
</html>
