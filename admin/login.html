<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Login – Panel de Modelos</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #27253a, #050814);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f5f5f5;
    }
    .card {
      width: 360px;
      padding: 28px 26px 24px;
      border-radius: 18px;
      background: radial-gradient(circle at top, rgba(210, 190, 120, 0.22), #050814);
      border: 1px solid rgba(180, 160, 90, 0.9);
      box-shadow:
        0 0 20px rgba(0, 0, 0, 0.9),
        0 0 26px rgba(0, 0, 0, 0.85);
    }
    h1 {
      margin: 0 0 6px;
      font-size: 22px;
      letter-spacing: 0.5px;
    }
    .subtitle {
      font-size: 13px;
      opacity: 0.8;
      margin-bottom: 22px;
    }
    label {
      display: block;
      font-size: 13px;
      margin-bottom: 4px;
      opacity: 0.9;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 14px;
      border-radius: 10px;
      border: 1px solid #33384d;
      background: #090c16;
      color: #f5f5f5;
      font-size: 14px;
      outline: none;
    }
    input:focus {
      border-color: #e3c96f;
    }
    button {
      width: 100%;
      padding: 10px 14px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      background: linear-gradient(135deg, #f1dd8a, #c59d42);
      color: #2b220e;
      box-shadow:
        0 0 16px rgba(0, 0, 0, 0.9),
        0 0 20px rgba(210, 180, 90, 0.9);
      margin-top: 4px;
    }
    .error {
      margin-top: 10px;
      font-size: 13px;
      color: #ff9b9b;
      min-height: 18px;
    }
    .brand {
      font-size: 12px;
      text-align: center;
      margin-top: 16px;
      opacity: 0.7;
    }
  </style>
</head>
<body>

<div class="card">
  <h1>Panel de Modelos</h1>
  <div class="subtitle">Inicia sesión para ver los horarios y resultados de los livestreams.</div>

  <form onsubmit="return handleLogin(event)">
    <label for="user">Usuario</label>
    <input id="user" autocomplete="off" />

    <label for="pass">Contraseña</label>
    <input id="pass" type="password" />

    <button type="submit">Entrar</button>
    <div id="error" class="error"></div>
  </form>

  <div class="brand">Livestream GB • Internal</div>
</div>

<script>
const VALID_USER = "ModelsDpt";
const VALID_PASS = "Livestream2026";

function handleLogin(e) {
  e.preventDefault();
  const user = document.getElementById("user").value.trim();
  const pass = document.getElementById("pass").value.trim();
  const errorEl = document.getElementById("error");

  if (!user || !pass) {
    errorEl.textContent = "Completa usuario y contraseña.";
    return false;
  }

  if (user === VALID_USER && pass === VALID_PASS) {
    // guardamos "sesión" en el navegador
    sessionStorage.setItem("modelsAdmin", "1");
    window.location.href = "/admin/dashboard.html";
  } else {
    errorEl.textContent = "Credenciales inválidas.";
  }

  return false;
}
</script>

</body>
</html>
