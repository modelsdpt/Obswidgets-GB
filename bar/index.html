<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Pikachu Goal Bar</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="goal-wrapper">
    <div id="bar-fill"></div>
    <div class="particles"></div>
    <div class="goal-title">Double Penetration</div>
  </div>

  <div class="goal-amount"></div>

  <!-- 🔊 Sonido por TIP (pika pika) -->
  <audio
    id="tipSound"
    src="https://www.myinstants.com/media/sounds/pika-pika-pikaaaaa.mp3"
    preload="auto">
  </audio>

  <!-- 🔊 Sonido cuando la GOAL se llena (thunderbolt) -->
  <audio
    id="goalSound"
    src="https://www.myinstants.com/media/sounds/pikachu-thunderbolt.mp3"
    preload="auto">
  </audio>

  <!-- IMPORTANTE: script al final para que los getElementById NO sean null -->
  <script src="script.js"></script>
</body>
</html>
