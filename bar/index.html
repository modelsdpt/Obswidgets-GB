<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Pikachu Goal Bar</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="goal-widget">
  <div class="goal-label">GOAL!</div>

  <div id="goal-wrapper">
    <div id="bar-fill"></div>
    <div class="goal-title">Double Penetration</div>
  </div>

  <div class="goal-amount" id="goal-amount"></div>
</div>

<audio
  id="tipSound"
  src="https://www.myinstants.com/media/sounds/pika-pika.mp3"
  preload="auto">
</audio>

<audio
  id="goalFullSound"
  src="https://www.myinstants.com/media/sounds/pikachu-thunderbolt.mp3"
  preload="auto">
</audio>


<script src="script.js"></script>
</body>
</html>
