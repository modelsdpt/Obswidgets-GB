<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Raffle Widget</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="raffle-widget" class="raffle-widget hidden">
    <div class="raffle-header">
      <div class="raffle-badge">RAFFLE</div>
      <h2 id="raffle-title" class="raffle-title">Choosing winner...</h2>
    </div>

    <div id="raffle-names" class="raffle-names"></div>

    <div id="raffle-winner-screen" class="raffle-winner-screen hidden">
      <div class="winner-label">WINNER</div>
      <div id="raffle-winner-name" class="winner-name">---</div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
