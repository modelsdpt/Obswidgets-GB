<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Agenda tu horario – Livestream GB</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #050814;
      font-family: "Segoe UI Emoji", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .card {
      width: 480px;
      border-radius: 18px;
      padding: 24px 24px 20px;
      background: radial-gradient(circle at top, rgba(210, 190, 120, 0.22), #050814);
      border: 1px solid rgba(180, 160, 90, 0.9);
      box-shadow:
        0 0 20px rgba(0, 0, 0, 0.9),
        0 0 26px rgba(0, 0, 0, 0.85);
    }
    h1 {
      font-size: 22px;
      margin: 0 0 6px;
    }
    .subtitle {
      font-size: 13px;
      opacity: 0.8;
      margin-bottom: 14px;
    }
    .markdown {
      font-size: 12px;
      background: rgba(5, 8, 20, 0.75);
      border-radius: 12px;
      padding: 10px 12px;
      border: 1px solid rgba(120,120,150,0.7);
      margin-bottom: 16px;
      line-height: 1.5;
    }
    .markdown strong {
      color: #f1dd8a;
    }
    .markdown ul {
      margin: 6px 0 10px;
      padding-left: 18px;
    }
    .markdown li {
      margin-bottom: 2px;
    }

    label {
      display: block;
      font-size: 13px;
      margin-bottom: 4px;
      opacity: 0.95;
    }
    select, input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #33384d;
      background: #696a6e;
      color: #f5f5f5;
      font-size: 14px;
      margin-bottom: 12px;
      outline: none;
    }
    select:focus, input:focus {
      border-color: #e3c96f;
    }
    button {
      width: 100%;
      margin-top: 10px;
      padding: 10px 14px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      background: linear-gradient(135deg, #f1dd8a, #c59d42);
      color: #2b220e;
      box-shadow:
        0 0 16px rgba(0, 0, 0, 0.9),
        0 0 20px rgba(210, 180, 90, 0.9);
    }
    button:disabled {
      opacity: 0.5;
      cursor: default;
      box-shadow: none;
    }
    .status {
      margin-top: 12px;
      font-size: 13px;
    }
    .status.ok  { color: #9be29b; }
    .status.error { color: #ff9b9b; }
  </style>
</head>
<body>

<div class="card">
  <h1>Hola, bienvenida a Livestream GB</h1>
  <div class="subtitle">
    Agenda el horario de inicio de tu livestream. El equipo completa la hora de fin.
  </div>

  <label for="model">¿Qué modelo eres?</label>
  <select id="model">
    <option value="">Selecciona tu nombre</option>
    <option value="Lili">Lili Moon</option>
    <option value="Megan">Megan</option>
    <option value="Zoe">Zoe</option>
    <option value="Charlotte">Charlotte</option>
    <option value="Misty">Misty</option>
    <option value="Leana">Leana</option>
    <option value="Nikki">Nikki</option>
    <option value="Molly">Molly</option>
    <option value="Sasha">Sasha</option>
    <option value="Sara">Sara</option>
    <option value="Sophi">Sophi</option>
  </select>

  <label for="date">Día del evento</label>
  <input id="date" type="date" />

  <label for="slot">Horario de inicio (tu hora local)</label>
  <select id="slot">
    <option value="">Selecciona un horario</option>
  </select>

  <label for="theme">Theme</label>
<input
  id="theme"
  type="text"
  maxlength="120"
    placeholder="Example: Schoolgirl, Fitness, Pink Party, Valentine, Lingerie..."/>

  <button id="saveBtn" onclick="saveSchedule()">Guardar horario</button>

  <div id="status" class="status"></div>
</div>

      { start: "05:00", label: "05:00 (next day) 🇸🇰" },
    ],
  };

  const MODEL_OFFSET_TO_EST = {
    Zoe: -1,
    Megan: -1,
    Misty: -1,
    Sunny: -1,
    Nikki: -1,
    Molly: -1,
    Leana: -1,
    Charlotte: -1,
    Sasha: 2,
    Sara: 6,
    Sophi: 6,
    Kali: 7,
    Shani: 7,
  };

  const statusEl = document.getElementById("status");
  const saveBtn = document.getElementById("saveBtn");
  const modelSelect = document.getElementById("model");
  const slotSelect = document.getElementById("slot");

  modelSelect.addEventListener("change", () => {
    const model = modelSelect.value;
    slotSelect.innerHTML = '<option value="">Selecciona un horario</option>';

    if (!model || !MODEL_SLOTS[model]) return;

    MODEL_SLOTS[model].forEach((slot) => {
      const opt = document.createElement("option");
      opt.value = slot.start;
      opt.textContent = slot.label;
      slotSelect.appendChild(opt);
    });
  });

  function convertLocalToEst(dateStr, timeStr, modelName) {
    const offset = MODEL_OFFSET_TO_EST[modelName] ?? 0;

    const [y, m, d] = dateStr.split("-").map(Number);
    const [hh, mm] = timeStr.split(":").map(Number);

    let totalMinutes = hh * 60 + mm;
    totalMinutes -= offset * 60;

    let dayShift = 0;
    if (totalMinutes < 0) {
      totalMinutes += 24 * 60;
      dayShift = -1;
    } else if (totalMinutes >= 24 * 60) {
      totalMinutes -= 24 * 60;
      dayShift = 1;
    }

    const estHour = String(Math.floor(totalMinutes / 60)).padStart(2, "0");
    const estMin = String(totalMinutes % 60).padStart(2, "0");

    const dt = new Date(Date.UTC(y, m - 1, d));
    dt.setUTCDate(dt.getUTCDate() + dayShift);

    const estYear = dt.getUTCFullYear();
    const estMonth = String(dt.getUTCMonth() + 1).padStart(2, "0");
    const estDay = String(dt.getUTCDate()).padStart(2, "0");

    return {
      date: `${estYear}-${estMonth}-${estDay}`,
      start: `${estHour}:${estMin}`,
    };
  }

  function saveSchedule() {
    const modelName = modelSelect.value;
    const dateLocal = document.getElementById("date").value;
    const startLocal = slotSelect.value;
    const theme = document.getElementById("theme").value.trim();

    statusEl.textContent = "";
    statusEl.className = "status";

    if (!modelName || !dateLocal || !startLocal || !theme) {
      statusEl.textContent = "Completa modelo, fecha, horario y temática.";
      statusEl.classList.add("error");
      return;
    }

    const { date: dateEST, start: startEST } =
      convertLocalToEst(dateLocal, startLocal, modelName);

    saveBtn.disabled = true;

    fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        modelName,
        theme,
        date: dateEST,
        start: startEST,
        originalDate: dateLocal,
        originalStart: startLocal,
      }),
    })
      .then((res) => res.json())
      .then((data) => {
        if (data && data.success) {
          statusEl.textContent = "Horario guardado / actualizado. Gracias ♥";
          statusEl.classList.add("ok");
          document.getElementById("theme").value = "";
        } else {
          throw new Error(data?.message || "Error desconocido");
        }
      })
      .catch((err) => {
        console.error(err);
        statusEl.textContent =
          "Hubo un problema guardando tu horario. Intenta más tarde.";
        statusEl.classList.add("error");
      })
      .finally(() => {
        saveBtn.disabled = false;
      });
  }
