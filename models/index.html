<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Agenda tu horario – Livestream GB</title>
  <style>
    * { box-sizing: border-box; }
    body {
  margin: 0;
  background: #050814;
  font-family: "Segoe UI Emoji", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #f5f5f5;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  min-height: 100vh;
  padding: 40px 20px;
}

    .card {
      width: 480px;
      border-radius: 18px;
      padding: 24px 24px 20px;
      background: radial-gradient(circle at top, rgba(210, 190, 120, 0.22), #050814);
      border: 1px solid rgba(180, 160, 90, 0.9);
      box-shadow:
        0 0 20px rgba(0, 0, 0, 0.9),
        0 0 26px rgba(0, 0, 0, 0.85);
    }
    h1 {
      font-size: 22px;
      margin: 0 0 6px;
    }
    .subtitle {
      font-size: 13px;
      opacity: 0.8;
      margin-bottom: 14px;
    }
    .markdown {
      font-size: 12px;
      background: rgba(5, 8, 20, 0.75);
      border-radius: 12px;
      padding: 10px 12px;
      border: 1px solid rgba(120,120,150,0.7);
      margin-bottom: 16px;
      line-height: 1.5;
    }
    .markdown strong {
      color: #f1dd8a;
    }
    .markdown ul {
      margin: 6px 0 10px;
      padding-left: 18px;
    }
    .markdown li {
      margin-bottom: 2px;
    }

    label {
      display: block;
      font-size: 13px;
      margin-bottom: 4px;
      opacity: 0.95;
    }
    select, input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #33384d;
      background: #696a6e;
      color: #f5f5f5;
      font-size: 14px;
      margin-bottom: 12px;
      outline: none;
    }
    select:focus, input:focus {
      border-color: #e3c96f;
    }
    button {
      width: 100%;
      margin-top: 10px;
      padding: 10px 14px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      background: linear-gradient(135deg, #f1dd8a, #c59d42);
      color: #2b220e;
      box-shadow:
        0 0 16px rgba(0, 0, 0, 0.9),
        0 0 20px rgba(210, 180, 90, 0.9);
    }
    button:disabled {
      opacity: 0.5;
      cursor: default;
      box-shadow: none;
    }
    .status {
      margin-top: 12px;
      font-size: 13px;
    }
    .status.ok  { color: #9be29b; }
    .status.error { color: #ff9b9b; }
  </style>
</head>
<body>

<div class="card">
  <h1>Hola, bienvenida a Livestream GB</h1>
  <div class="subtitle">
    Agenda el horario de inicio de tu livestream. El equipo completa la hora de fin.
  </div>
  <label for="model">¿Qué modelo eres?</label>
  <select id="model">
    <option value="">Selecciona tu nombre</option>
    <option value="Sunny">Sunny</option>
    <option value="Nikki">Nikki</option>
    <option value="Moly">Molly</option>
    <option value="Sasha">Sasha</option>
    <option value="Sara">Sara</option>
    <option value="Sophi">Sophi</option>
    <option value="Sophi">Zoe</option>
    <option value="Sophi">Megan</option>
    <option value="Sophi">Misty</option>
  </select>

  <label for="date">Día del evento</label>
  <input id="date" type="date" />

  <label for="slot">Horario de inicio (tu hora local)</label>
  <select id="slot">
    <option value="">Selecciona un horario</option>
  </select>

  <button id="saveBtn" onclick="saveSchedule()">Guardar horario</button>

  <div id="status" class="status"></div>
</div>

<script>
const API_URL = "/api/model-schedule";

// slots de inicio por modelo (en su hora local)
// Puedes ajustar estos a tu lógica interna de 1h/2h, pero visualmente ya tienes la lista arriba.
const MODEL_SLOTS = {
  // Colombia
   "Zoe": [
    { start: "09:00", label: "09:00 AM (Colombia)" },
    { start: "10:00", label: "10:00 AM (Colombia )" },
    { start: "11:00", label: "11:00 AM (Colombia )" },
    { start: "12:00", label: "12:00 PM (Colombia )" },
    { start: "19:00", label: "07:00 PM (Colombia )" },
    { start: "20:00", label: "08:00 PM (Colombia )" },
    { start: "21:00", label: "09:00 PM (Colombia )" },
    { start: "22:00", label: "10:00 PM (Colombia )" },
  ],
    "Megan": [
    { start: "09:00", label: "09:00 AM (Colombia)" },
    { start: "10:00", label: "10:00 AM (Colombia )" },
    { start: "11:00", label: "11:00 AM (Colombia )" },
    { start: "12:00", label: "12:00 PM (Colombia )" },
    { start: "19:00", label: "07:00 PM (Colombia )" },
    { start: "20:00", label: "08:00 PM (Colombia )" },
    { start: "21:00", label: "09:00 PM (Colombia )" },
    { start: "22:00", label: "10:00 PM (Colombia )" },
  ],
  "Misty": [
    { start: "09:00", label: "09:00 AM (Colombia)" },
    { start: "10:00", label: "10:00 AM (Colombia )" },
    { start: "11:00", label: "11:00 AM (Colombia )" },
    { start: "12:00", label: "12:00 PM (Colombia )" },
    { start: "19:00", label: "07:00 PM (Colombia )" },
    { start: "20:00", label: "08:00 PM (Colombia )" },
    { start: "21:00", label: "09:00 PM (Colombia )" },
    { start: "22:00", label: "10:00 PM (Colombia )" },
  ],
  "Sunny": [
    { start: "09:00", label: "09:00 AM (Colombia)" },
    { start: "10:00", label: "10:00 AM (Colombia )" },
    { start: "11:00", label: "11:00 AM (Colombia )" },
    { start: "12:00", label: "12:00 PM (Colombia )" },
    { start: "19:00", label: "07:00 PM (Colombia )" },
    { start: "20:00", label: "08:00 PM (Colombia )" },
    { start: "21:00", label: "09:00 PM (Colombia )" },
    { start: "22:00", label: "10:00 PM (Colombia )" },
  ],
  "Nikki": [
    { start: "09:00", label: "09:00 AM (Colombia )" },
    { start: "10:00", label: "10:00 AM (Colombia )" },
    { start: "11:00", label: "11:00 AM (Colombia )" },
    { start: "12:00", label: "12:00 PM (Colombia )" },
    { start: "19:00", label: "07:00 PM (Colombia )" },
    { start: "20:00", label: "08:00 PM (Colombia )" },
    { start: "21:00", label: "09:00 PM (Colombia )" },
    { start: "22:00", label: "10:00 PM (Colombia )" },
  ],
  "Molly": [

    { start: "10:00", label: "10:00 AM (Colombia )" },
    { start: "11:00", label: "11:00 AM (Colombia )" },
    { start: "12:00", label: "12:00 PM (Colombia )" },
    { start: "19:00", label: "07:00 PM (Colombia )" },
    { start: "20:00", label: "08:00 PM (Colombia)" },
    { start: "21:00", label: "09:00 PM (Colombia)" },
    { start: "22:00", label: "10:00 PM (Colombia)" },
  ],

  // Argentina
  "Sasha": [
    { start: "12:00", label: "12:00 PM (Argentina )" },
    { start: "13:00", label: "01:00 PM (Argentina )" },
    { start: "14:00", label: "02:00 PM (Argentina )" },
    { start: "15:00", label: "03:00 PM (Argentina )" },
    { start: "21:00", label: "09:00 PM (Argentina )" },
    { start: "22:00", label: "10:00 PM (Argentina )" },
    { start: "23:00", label: "11:00 PM (Argentina )" },
    { start: "00:00", label: "12:00 AM (Argentina )" },
  ],

  // Eslovaquia
"Sara": [
  { start: "16:00", label: "16:00 (04:00 PM) 🇸🇰" },
  { start: "17:00", label: "17:00 (05:00 PM) 🇸🇰" },

  { start: "02:00", label: "02:00 (día siguiente) 🇸🇰" },
  { start: "03:00", label: "03:00 (día siguiente) 🇸🇰" },

  { start: "05:00", label: "05:00 (día siguiente) 🇸🇰" },
],
"Sophi": [
  { start: "16:00", label: "16:00 (04:00 PM) 🇸🇰" },
  { start: "17:00", label: "17:00 (05:00 PM) 🇸🇰" },
  { start: "18:00", label: "18:00 (06:00 PM) 🇸🇰" },
  { start: "19:00", label: "19:00 (07:00 PM) 🇸🇰" },
  { start: "02:00", label: "02:00 (día siguiente) 🇸🇰" },
  { start: "03:00", label: "03:00 (día siguiente) 🇸🇰" },
  { start: "04:00", label: "04:00 (día siguiente) 🇸🇰" },
  { start: "05:00", label: "05:00 (día siguiente) 🇸🇰" },
]
};

const statusEl = document.getElementById("status");
const saveBtn = document.getElementById("saveBtn");
const modelSelect = document.getElementById("model");
const slotSelect = document.getElementById("slot");

modelSelect.addEventListener("change", () => {
  const model = modelSelect.value;
  slotSelect.innerHTML = '<option value="">Selecciona un horario</option>';

  if (!model || !MODEL_SLOTS[model]) return;

  MODEL_SLOTS[model].forEach(slot => {
    const opt = document.createElement("option");
    opt.value = slot.start;
    opt.textContent = slot.label;
    slotSelect.appendChild(opt);
  });
});

function saveSchedule() {
  const modelName = modelSelect.value;
  const date = document.getElementById("date").value;
  const start = slotSelect.value;

  statusEl.textContent = "";
  statusEl.className = "status";

  if (!modelName || !date || !start) {
    statusEl.textContent = "Completa modelo, fecha y horario.";
    statusEl.classList.add("error");
    return;
  }

  saveBtn.disabled = true;

  fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ modelName, date, start })
  })
    .then(res => res.json())
    .then(data => {
      if (data && data.success) {
        statusEl.textContent = "Horario guardado / actualizado. Gracias ♥";
        statusEl.classList.add("ok");
      } else {
        throw new Error(data?.message || "Error desconocido");
      }
    })
    .catch(err => {
      console.error(err);
      statusEl.textContent = "Hubo un problema guardando tu horario. Intenta más tarde.";
      statusEl.classList.add("error");
    })
    .finally(() => {
      saveBtn.disabled = false;
    });
}
</script>

</body>
</html>
