<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Panel OF</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #111;
      color: #fff;
    }
    h2 {
      color: #00f7ff;
      text-shadow: 0 0 10px #00eaff;
    }
    input {
      width: 250px;
      padding: 10px;
      margin-top: 10px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
    }
    button {
      margin-top: 10px;
      padding: 12px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      color: #000;
      background: #00f7ff;
      box-shadow: 0 0 10px #00dfff;
    }
    .danger {
      background: red;
      color: white !important;
      box-shadow: 0 0 10px red;
    }
    hr {
      margin: 30px 0;
      border: 1px solid #444;
    }

    /* ===== LAYOUT Enviar Tip + lista de nombres ===== */
    .tip-row {
      display: flex;
      align-items: flex-start;
      gap: 24px;
    }
    .tip-form {
      flex: 1 1 auto;
    }
    .names-panel {
      flex: 0 0 240px;
      max-width: 260px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #181818;
      border: 1px solid #333;
      box-shadow: 0 0 12px rgba(0,0,0,0.7);
    }
    .names-panel h3 {
      margin: 0 0 8px;
      font-size: 15px;
      color: #ffd966;
    }
    #names-list {
      max-height: 220px;
      overflow-y: auto;
      margin-top: 4px;
    }
    .name-pill {
      display: inline-block;
      margin: 4px 4px 0 0;
      padding: 6px 10px;
      border-radius: 999px;
      background: #222;
      border: 1px solid #555;
      color: #fff;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
    }
    .name-pill:hover {
      background: #00f7ff;
      color: #000;
      border-color: #00f7ff;
      box-shadow: 0 0 8px #00f7ff;
    }
    .names-empty {
      font-size: 12px;
      opacity: 0.8;
      margin-top: 4px;
    }

    /* ===== ACTION TIMER ===== */
    .timer-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 10px;
      margin-bottom: 5px;
    }
    .timer-buttons button {
      flex: 1 1 80px;
      min-width: 80px;
    }
    .timer-stop-btn {
      background: #ff8800;
      color: #000;
      box-shadow: 0 0 10px #ff8800;
    }

    /* ===== ENCUESTA A/B ===== */
    .poll-admin {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      align-items: flex-start;
    }

    .poll-inputs {
      min-width: 260px;
      max-width: 320px;
    }

    .poll-inputs label {
      display: block;
      margin-top: 6px;
      margin-bottom: 4px;
      font-weight: bold;
    }

    .poll-inputs input {
      width: 100%;
      margin-top: 0;
      margin-bottom: 4px;
    }

    .poll-live {
      flex: 1 1 260px;
      min-width: 260px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #181818;
      border: 1px solid #333;
      box-shadow: 0 0 12px rgba(0,0,0,0.7);
    }

    #pollQuestionText {
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .poll-options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .poll-option {
      background: #222;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #444;
    }

    .poll-option-label {
      font-weight: bold;
      margin-bottom: 4px;
    }

    .poll-option-bar {
      position: relative;
      width: 100%;
      height: 14px;
      border-radius: 999px;
      background: #101010;
      overflow: hidden;
      margin-bottom: 4px;
    }

    .poll-option-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #00f7ff, #00c8ff);
      box-shadow: 0 0 8px rgba(0, 247, 255, 0.9);
      transition: width 0.2s ease-out;
    }

    .poll-option-stats {
      font-size: 13px;
      opacity: 0.9;
      margin-bottom: 4px;
    }

    .poll-option button {
      width: 100%;
      padding: 6px 8px;
      font-size: 13px;
      margin-top: 2px;
    }

    .volume-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 4px;
}

.volume-row input[type="range"] {
  flex: 1;
}

  </style>
</head>
<body>

<h2>Enviar Tip</h2>

<div class="tip-row">
  <!-- FORMULARIO IZQUIERDA -->
  <div class="tip-form">
    <label>Nombre</label>
    <br>
    <input id="name" placeholder="Nombre del usuario">

    <br><br>

    <label>Monto</label>
    <br>
    <input id="amount" type="number" placeholder="Ej: 20">

    <br>

    <button onclick="sendTip()">Enviar Tip</button>
  </div>

  <!-- LISTA DERECHA -->
  <div class="names-panel">
    <h3>Últimos nombres</h3>
    <div id="names-list">
      <div class="names-empty">Aún no hay nombres. Envía un tip y aparecerán aquí.</div>
    </div>
  </div>
</div>

<br><br>

<label style="display:block; font-size:13px; margin-top:4px;">
  Volumen del tip
</label>
<div class="volume-row">
  <input
    id="tip-volume"
    type="range"
    min="0"
    max="100"
    value="100"
    oninput="updateVolumeLabel(this.value)"
    onchange="sendTipVolume(this.value)"
  />
  <span id="tip-volume-label">100%</span>
</div>

<hr>

<h2>Top 3</h2>
<button class="danger" onclick="clearAll()">Limpiar Top 3</button>

<hr>

<h2>Goal Bar</h2>

<label>Nueva Goal ($)</label>
<br>
<input id="goal" type="number" placeholder="Ej: 200">

<br>
<button onclick="setGoal()">Establecer Goal</button>
<button class="danger" onclick="clearGoal()">Limpiar Goal</button>

<hr>

<h2>Action Timer</h2>
<div class="timer-buttons">
  <button onclick="startActionTimer(120)">120s</button>
  <button onclick="startActionTimer(30)">30s</button>
  <button onclick="startActionTimer(40)">40s</button>
  <button onclick="startActionTimer(45)">45s</button>
  <button onclick="startActionTimer(60)">60s</button>
</div>
<button class="timer-stop-btn" onclick="stopActionTimer()">Detener Cronómetro</button>

<hr>

<button onclick="fetch('/api/send', {
  method:'POST',
  headers:{'Content-Type':'application/json'},
  body: JSON.stringify({
    modelId:'roman001',
    type:'roulette'
  })
})">
🎰 Girar Ruleta
</button>

<hr>

<h2>Encuestas (A / B)</h2>

<div class="poll-admin">
  <div class="poll-inputs">
    <label for="pollQuestion">Texto de la encuesta</label>
    <input id="pollQuestion" placeholder="¿Qué hacemos ahora? (Ej: Soltar / Apretar)">

    <label for="pollOptionA">Opción A</label>
    <input id="pollOptionA" placeholder="Soltar">

    <label for="pollOptionB">Opción B</label>
    <input id="pollOptionB" placeholder="Apretar">

    <button onclick="pollStart()">Iniciar / Reiniciar encuesta</button>
    <button class="danger" onclick="pollClear()">Borrar encuesta</button>
  </div>

  <div class="poll-live">
    <div id="pollQuestionText">No hay encuesta activa.</div>

    <div class="poll-options">
      <div class="poll-option">
        <div class="poll-option-label" id="pollLabelA">—</div>
        <div class="poll-option-bar">
          <div class="poll-option-fill" id="pollFillA"></div>
        </div>
        <div class="poll-option-stats" id="pollStatsA">0 votos (0%)</div>
        <button onclick="pollVote('A')">Votar A</button>
      </div>

      <div class="poll-option">
        <div class="poll-option-label" id="pollLabelB">—</div>
        <div class="poll-option-bar">
          <div class="poll-option-fill" id="pollFillB"></div>
        </div>
        <div class="poll-option-stats" id="pollStatsB">0 votos (0%)</div>
        <button onclick="pollVote('B')">Votar B</button>
      </div>
    </div>
  </div>
</div>

<script>
  const MODEL_ID = "roman001";
  const API_URL = "/api/send";

  /* ========= NOMBRES RECIENTES (panel derecha) ========= */

  let recentNames = [];
  const MAX_NAMES = 30;

  function renderRecentNames() {
    const container = document.getElementById("names-list");
    if (!container) return;

    container.innerHTML = "";

    if (!recentNames.length) {
      const empty = document.createElement("div");
      empty.className = "names-empty";
      empty.textContent =
        "Aún no hay nombres. Envía un tip y aparecerán aquí.";
      container.appendChild(empty);
      return;
    }

    recentNames.forEach((name) => {
      const pill = document.createElement("span");
      pill.className = "name-pill";
      pill.textContent = name;
      pill.onclick = () => {
        const nameInput = document.getElementById("name");
        if (nameInput) nameInput.value = name;
      };
      container.appendChild(pill);
    });
  }

  function addRecentName(name) {
    const trimmed = (name || "").trim();
    if (!trimmed) return;

    const lower = trimmed.toLowerCase();
    recentNames = [trimmed, ...recentNames.filter((n) => n.toLowerCase() !== lower)];

    if (recentNames.length > MAX_NAMES) {
      recentNames.length = MAX_NAMES;
    }

    renderRecentNames();
  }

  // inicializar la vista de nombres al cargar (panel vacío + mensaje)
  renderRecentNames();

  /* ========= ENVIAR TIP / GOAL / TIMER ========= */

  function sendTip() {
    const nameInput = document.getElementById("name");
    const amountInput = document.getElementById("amount");

    if (!nameInput || !amountInput) {
      alert("Error interno: falta input.");
      return;
    }

    const name = nameInput.value.trim();
    const amount = Number(amountInput.value);

    if (!name || !amount) {
      alert("Debes escribir un nombre y un monto válido.");
      return;
    }

    addRecentName(name);
    sendToServer("tip", { name, amount });
    amountInput.value = "";
  }

  function clearAll() {
    sendToServer("clear");
    clearRecentNames();
  }

  function setGoal() {
    const goalInput = document.getElementById("goal");
    if (!goalInput) return;

    const goal = Number(goalInput.value);
    if (!goal || goal <= 0) {
      alert("La goal debe ser mayor a 0.");
      return;
    }
    sendToServer("setGoal", { goal });
  }

  function clearGoal() {
    sendToServer("clearGoal");
  }

  function startActionTimer(seconds) {
    sendToServer("actionTimer", { seconds });
  }

  function stopActionTimer() {
    sendToServer("actionTimerStop");
  }

  function sendToServer(type, payload = {}) {
    fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        modelId: MODEL_ID,
        type,
        payload,
      }),
    })
      .then((res) => {
        if (!res.ok) {
          console.error("❌ Respuesta HTTP no OK:", res.status);
          return null;
        }
        const ct = res.headers.get("content-type") || "";
        if (!ct.includes("application/json")) return null;
        return res.json();
      })
      .then((data) => {
        if (data) console.log("Respuesta backend:", data);
      })
      .catch((err) => console.error("❌ Error en fetch:", err));
  }

  function updateVolumeLabel(value) {
  const label = document.getElementById("tip-volume-label");
  if (label) {
    label.textContent = `${value}%`;
  }
}

function sendTipVolume(value) {
  const vol = Math.max(0, Math.min(1, Number(value) / 100));
  sendToServer("tipVolume", { volume: vol });
}


  /* ========= ENCUESTA A/B ========= */

  let pollState = {
    question: "",
    optionA: "",
    optionB: "",
    votesA: 0,
    votesB: 0,
  };

  function pollUpdateUI() {
    const qEl = document.getElementById("pollQuestionText");
    const labelAEl = document.getElementById("pollLabelA");
    const labelBEl = document.getElementById("pollLabelB");
    const statsAEl = document.getElementById("pollStatsA");
    const statsBEl = document.getElementById("pollStatsB");
    const fillAEl = document.getElementById("pollFillA");
    const fillBEl = document.getElementById("pollFillB");

    if (!pollState.question) {
      if (qEl) qEl.textContent = "No hay encuesta activa.";
      if (labelAEl) labelAEl.textContent = "—";
      if (labelBEl) labelBEl.textContent = "—";
      if (statsAEl) statsAEl.textContent = "0 votos (0%)";
      if (statsBEl) statsBEl.textContent = "0 votos (0%)";
      if (fillAEl) fillAEl.style.width = "0%";
      if (fillBEl) fillBEl.style.width = "0%";
      return;
    }

    const total = pollState.votesA + pollState.votesB;
    const pctA = total ? Math.round((pollState.votesA * 100) / total) : 0;
    const pctB = total ? Math.round((pollState.votesB * 100) / total) : 0;

    if (qEl) qEl.textContent = pollState.question;
    if (labelAEl) labelAEl.textContent = `${pollState.optionA} (${pctA}%)`;
    if (labelBEl) labelBEl.textContent = `${pollState.optionB} (${pctB}%)`;
    if (statsAEl) statsAEl.textContent = `${pollState.votesA} voto(s) (${pctA}%)`;
    if (statsBEl) statsBEl.textContent = `${pollState.votesB} voto(s) (${pctB}%)`;
    if (fillAEl) fillAEl.style.width = `${pctA}%`;
    if (fillBEl) fillBEl.style.width = `${pctB}%`;
  }

  function pollBroadcast() {
    sendToServer("pollState", { ...pollState });
  }

  function pollStart() {
    const qInput = document.getElementById("pollQuestion");
    const aInput = document.getElementById("pollOptionA");
    const bInput = document.getElementById("pollOptionB");

    const question = qInput.value.trim();
    const optionA = aInput.value.trim();
    const optionB = bInput.value.trim();

    if (!question || !optionA || !optionB) {
      alert("Completa pregunta y ambas opciones.");
      return;
    }

    pollState = {
      question,
      optionA,
      optionB,
      votesA: 0,
      votesB: 0,
    };

    pollUpdateUI();
    pollBroadcast();
  }

  function pollVote(which) {
    if (!pollState.question) {
      alert("Primero inicia una encuesta.");
      return;
    }

    if (which === "A") {
      pollState.votesA += 1;
    } else if (which === "B") {
      pollState.votesB += 1;
    }

    pollUpdateUI();
    pollBroadcast();
  }

  function pollClear() {
    pollState = {
      question: "",
      optionA: "",
      optionB: "",
      votesA: 0,
      votesB: 0,
    };
    pollUpdateUI();
    sendToServer("pollClear");
  }

  // dejar UI consistente al cargar
  pollUpdateUI();
</script>

</body>
</html>
