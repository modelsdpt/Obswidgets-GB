<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Panel OF</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #111;
      color: #fff;
    }
    h2 {
      color: #00f7ff;
      text-shadow: 0 0 10px #00eaff;
    }
    input {
      width: 250px;
      padding: 10px;
      margin-top: 10px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
    }
    button {
      margin-top: 10px;
      padding: 12px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      color: #000;
      background: #00f7ff;
      box-shadow: 0 0 10px #00dfff;
    }
    .danger {
      background: red;
      color: white !important;
      box-shadow: 0 0 10px red;
    }
    hr {
      margin: 30px 0;
      border: 1px solid #444;
    }

    /* ===== LAYOUT Enviar Tip + lista de nombres ===== */
    .tip-row {
      display: flex;
      align-items: flex-start;
      gap: 24px;
    }
    .tip-form {
      flex: 1 1 auto;
    }
    .names-panel {
      flex: 0 0 240px;
      max-width: 260px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #181818;
      border: 1px solid #333;
      box-shadow: 0 0 12px rgba(0,0,0,0.7);
    }
    .names-panel h3 {
      margin: 0 0 8px;
      font-size: 15px;
      color: #ffd966;
    }
    #names-list {
      max-height: 220px;
      overflow-y: auto;
      margin-top: 4px;
    }
    .name-pill {
      display: inline-block;
      margin: 4px 4px 0 0;
      padding: 6px 10px;
      border-radius: 999px;
      background: #222;
      border: 1px solid #555;
      color: #fff;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
    }
    .name-pill:hover {
      background: #00f7ff;
      color: #000;
      border-color: #00f7ff;
      box-shadow: 0 0 8px #00f7ff;
    }
    .names-empty {
      font-size: 12px;
      opacity: 0.8;
      margin-top: 4px;
    }

    /* ===== ACTION TIMER ===== */
    .timer-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 10px;
      margin-bottom: 5px;
    }
    .timer-buttons button {
      flex: 1 1 80px;
      min-width: 80px;
    }
    .timer-stop-btn {
      background: #ff8800;
      color: #000;
      box-shadow: 0 0 10px #ff8800;
    }
  </style>
</head>
<body>

<h2>Enviar Tip</h2>

<div class="tip-row">
  <!-- FORMULARIO IZQUIERDA -->
  <div class="tip-form">
    <label>Nombre</label>
    <br>
    <input id="name" placeholder="Nombre del usuario">

    <br><br>

    <label>Monto</label>
    <br>
    <input id="amount" type="number" placeholder="Ej: 20">

    <br>

    <button onclick="sendTip()">Enviar Tip</button>
  </div>

  <!-- LISTA DERECHA -->
  <div class="names-panel">
    <h3>Últimos nombres</h3>
    <div id="names-list">
      <div class="names-empty">Aún no hay nombres. Envía un tip y aparecerán aquí.</div>
    </div>
  </div>
</div>

<hr>

<h2>Top 3</h2>
<button class="danger" onclick="clearAll()">Limpiar Top 3</button>

<hr>

<h2>Goal Bar</h2>

<label>Nueva Goal ($)</label>
<br>
<input id="goal" type="number" placeholder="Ej: 200">

<br>
<button onclick="setGoal()">Establecer Goal</button>
<button class="danger" onclick="clearGoal()">Limpiar Goal</button>

<hr>

<h2>Action Timer</h2>
<div class="timer-buttons">
  <button onclick="startActionTimer(15)">15s</button>
  <button onclick="startActionTimer(20)">20s</button>
  <button onclick="startActionTimer(40)">40s</button>
  <button onclick="startActionTimer(60)">60s</button>
</div>
<button class="timer-stop-btn" onclick="stopActionTimer()">Detener Cronómetro</button>

<hr>

<button onclick="fetch('/api/send', {
  method:'POST',
  headers:{'Content-Type':'application/json'},
  body: JSON.stringify({
    modelId:'roman001',
    type:'roulette'
  })
})">
🎰 Girar Ruleta
</button>

<script>
const MODEL_ID = "roman001";
const API_URL = "/api/send";   // ruta relativa

// memoria local de nombres
const knownNames = new Set();

function renderNamesList() {
  const container = document.getElementById("names-list");
  container.innerHTML = "";

  if (knownNames.size === 0) {
    const empty = document.createElement("div");
    empty.className = "names-empty";
    empty.textContent = "Aún no hay nombres. Envía un tip y aparecerán aquí.";
    container.appendChild(empty);
    return;
  }

  knownNames.forEach(name => {
    const pill = document.createElement("div");
    pill.className = "name-pill";
    pill.textContent = name;
    pill.onclick = () => {
      document.getElementById("name").value = name;
    };
    container.appendChild(pill);
  });
}

function registerName(name) {
  if (!name) return;
  knownNames.add(name);
  renderNamesList();
}

function sendTip() {
  const name = document.getElementById("name").value.trim();
  const amount = Number(document.getElementById("amount").value);

  if (!name || !amount) {
    alert("Debes escribir un nombre y un monto válido.");
    return;
  }

  // guarda el nombre en la lista rápida
  registerName(name);

  sendToServer("tip", { name, amount });
}

function clearAll() {
  // limpia top 3 en los widgets
  sendToServer("clear");
  // limpia listado de nombres
  knownNames.clear();
  renderNamesList();
}

function setGoal() {
  const goal = Number(document.getElementById("goal").value);
  if (!goal || goal <= 0) {
    alert("La goal debe ser mayor a 0.");
    return;
  }
  sendToServer("setGoal", { goal });
}

function clearGoal() {
  sendToServer("clearGoal");
}

/* ===== ACTION TIMER ===== */

function startActionTimer(seconds) {
  sendToServer("actionTimer", { seconds });
}

function stopActionTimer() {
  sendToServer("actionTimerStop");
}

/* ===== GENÉRICO ===== */

function sendToServer(type, payload = {}) {
  fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      modelId: MODEL_ID,
      type,
      payload
    })
  })
    .then(res => res.json())
    .then(data => console.log("Respuesta backend:", data))
    .catch(err => console.error("❌ Error en fetch:", err));
}

// render inicial de la lista vacía
renderNamesList();
</script>

</body>
</html>
