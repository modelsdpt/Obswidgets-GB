<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Panel OF</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #111;
      color: #fff;
    }
    h2 {
      color: #00f7ff;
      text-shadow: 0 0 10px #00eaff;
    }
    input {
      width: 250px;
      padding: 10px;
      margin-top: 10px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
    }
    button {
      margin-top: 10px;
      padding: 12px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      color: #000;
      background: #00f7ff;
      box-shadow: 0 0 10px #00dfff;
    }
    .danger {
      background: red;
      color: white !important;
      box-shadow: 0 0 10px red;
    }
    hr {
      margin: 30px 0;
      border: 1px solid #444;
    }

    /* ===== ACTION TIMER ===== */
    .timer-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 10px;
      margin-bottom: 5px;
    }
    .timer-buttons button {
      flex: 1 1 80px;
      min-width: 80px;
    }
    .timer-stop-btn {
      background: #ff8800;
      color: #000;
      box-shadow: 0 0 10px #ff8800;
    }
  </style>
</head>
<body>

<h2>Enviar Tip</h2>

<label>Nombre</label>
<br>
<input id="name" placeholder="Nombre del usuario">

<br><br>

<label>Monto</label>
<br>
<input id="amount" type="number" placeholder="Ej: 20">

<br>

<button onclick="sendTip()">Enviar Tip</button>

<hr>

<h2>Top 3</h2>
<button class="danger" onclick="clearAll()">Limpiar Top 3</button>

<hr>

<h2>Goal Bar</h2>

<label>Nueva Goal ($)</label>
<br>
<input id="goal" type="number" placeholder="Ej: 200">

<br>
<button onclick="setGoal()">Establecer Goal</button>
<button class="danger" onclick="clearGoal()">Limpiar Goal</button>

<hr>

<h2>Action Timer</h2>
<div class="timer-buttons">
  <button onclick="startActionTimer(15)">15s</button>
  <button onclick="startActionTimer(20)">20s</button>
  <button onclick="startActionTimer(40)">40s</button>
  <button onclick="startActionTimer(60)">60s</button>
</div>
<button class="timer-stop-btn" onclick="stopActionTimer()">Detener Cronómetro</button>

<hr>

<button onclick="fetch('/api/send', {
  method:'POST',
  headers:{'Content-Type':'application/json'},
  body: JSON.stringify({
    modelId:'roman001',
    type:'roulette'
  })
})">
🎰 Girar Ruleta
</button>

<script>
const MODEL_ID = "roman001";
const API_URL = "/api/send";   // ruta relativa

function sendTip() {
  const name = document.getElementById("name").value.trim();
  const amount = Number(document.getElementById("amount").value);

  if (!name || !amount) {
    alert("Debes escribir un nombre y un monto válido.");
    return;
  }

  sendToServer("tip", { name, amount });
}

function clearAll() {
  sendToServer("clear");
}

function setGoal() {
  const goal = Number(document.getElementById("goal").value);
  if (!goal || goal <= 0) {
    alert("La goal debe ser mayor a 0.");
    return;
  }
  sendToServer("setGoal", { goal });
}

function clearGoal() {
  sendToServer("clearGoal");
}

/* ===== ACTION TIMER ===== */

function startActionTimer(seconds) {
  // seconds: 10, 15, 30, 45...
  sendToServer("actionTimer", { seconds });
}

function stopActionTimer() {
  sendToServer("actionTimerStop");
}

/* ===== GENÉRICO ===== */

function sendToServer(type, payload = {}) {
  fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      modelId: MODEL_ID,
      type,
      payload
    })
  })
    .then(res => res.json())
    .then(data => console.log("Respuesta backend:", data))
    .catch(err => console.error("❌ Error en fetch:", err));
}
</script>

</body>
</html>
