<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Panel OF</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #111;
      color: #fff;
    }
    h2 {
      color: #00f7ff;
      text-shadow: 0 0 10px #00eaff;
    }
    input {
      width: 250px;
      padding: 10px;
      margin-top: 10px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
    }
    button {
      margin-top: 10px;
      padding: 12px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      color: #000;
      background: #00f7ff;
      box-shadow: 0 0 10px #00dfff;
    }
    .danger {
      background: red;
      color: white !important;
      box-shadow: 0 0 10px red;
    }
    hr {
      margin: 30px 0;
      border: 1px solid #444;
    }

    /* ===== LAYOUT Enviar Tip + lista de nombres ===== */
    .tip-row {
      display: flex;
      align-items: flex-start;
      gap: 24px;
    }
    .tip-form {
      flex: 1 1 auto;
    }
    .names-panel {
      flex: 0 0 240px;
      max-width: 260px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #181818;
      border: 1px solid #333;
      box-shadow: 0 0 12px rgba(0,0,0,0.7);
    }
    .names-panel h3 {
      margin: 0 0 8px;
      font-size: 15px;
      color: #ffd966;
    }
    #names-list {
      max-height: 220px;
      overflow-y: auto;
      margin-top: 4px;
    }
    .name-pill {
      display: inline-block;
      margin: 4px 4px 0 0;
      padding: 6px 10px;
      border-radius: 999px;
      background: #222;
      border: 1px solid #555;
      color: #fff;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
    }
    .name-pill:hover {
      background: #00f7ff;
      color: #000;
      border-color: #00f7ff;
      box-shadow: 0 0 8px #00f7ff;
    }
    .names-empty {
      font-size: 12px;
      opacity: 0.8;
      margin-top: 4px;
    }

    /* ===== ACTION TIMER ===== */
    .timer-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 10px;
      margin-bottom: 5px;
    }
    .timer-buttons button {
      flex: 1 1 80px;
      min-width: 80px;
    }
    .timer-stop-btn {
      background: #ff8800;
      color: #000;
      box-shadow: 0 0 10px #ff8800;
    }

    /* ===== BLACKJACK PLAYERS ===== */
    .bj-admin {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      align-items: flex-start;
    }

    .bj-inputs {
      min-width: 260px;
    }

    .bj-inputs label {
      display: block;
      margin-bottom: 4px;
      font-weight: bold;
    }

    .bj-inputs input {
      width: 100%;
      margin-bottom: 6px;
    }

    .bj-inputs button {
      display: inline-block;
      margin-right: 8px;
      margin-top: 6px;
    }

    .bj-lists {
      display: flex;
      gap: 16px;
    }

    .bj-column {
      min-width: 160px;
    }

    .bj-column-title {
      font-weight: bold;
      margin-bottom: 6px;
      color: #ffd36a;
      text-shadow: 0 0 8px #000;
    }

    .bj-select {
      width: 180px;
      height: 110px;
      background: #222;
      color: #fff;
      border-radius: 6px;
      border: 1px solid #555;
    }

    .bj-column button {
      display: block;
      width: 100%;
      margin-top: 6px;
      font-size: 14px;
    }
  </style>
</head>
<body>

<h2>Enviar Tip</h2>

<div class="tip-row">
  <!-- FORMULARIO IZQUIERDA -->
  <div class="tip-form">
    <label>Nombre</label>
    <br>
    <input id="name" placeholder="Nombre del usuario">

    <br><br>

    <label>Monto</label>
    <br>
    <input id="amount" type="number" placeholder="Ej: 20">

    <br>

    <button onclick="sendTip()">Enviar Tip</button>
  </div>

  <!-- LISTA DERECHA -->
  <div class="names-panel">
    <h3>Últimos nombres</h3>
    <div id="names-list">
      <div class="names-empty">Aún no hay nombres. Envía un tip y aparecerán aquí.</div>
    </div>
  </div>
</div>

<hr>

<h2>Top 3</h2>
<button class="danger" onclick="clearAll()">Limpiar Top 3</button>

<hr>

<h2>Goal Bar</h2>

<label>Nueva Goal ($)</label>
<br>
<input id="goal" type="number" placeholder="Ej: 200">

<br>
<button onclick="setGoal()">Establecer Goal</button>
<button class="danger" onclick="clearGoal()">Limpiar Goal</button>

<hr>

<h2>Action Timer</h2>
<div class="timer-buttons">
  <button onclick="startActionTimer(20)">20s</button>
  <button onclick="startActionTimer(40)">40s</button>
  <button onclick="startActionTimer(60)">60s</button>
  <button onclick="startActionTimer(90)">90s</button>
</div>
<button class="timer-stop-btn" onclick="stopActionTimer()">Detener Cronómetro</button>

<hr>

<button onclick="fetch('/api/send', {
  method:'POST',
  headers:{'Content-Type':'application/json'},
  body: JSON.stringify({
    modelId:'roman001',
    type:'roulette'
  })
})">
🎰 Girar Ruleta
</button>

<hr>

<h2>Blackjack Players</h2>

<div class="bj-admin">
  <div class="bj-inputs">
    <label for="bjName">Nombre jugador</label>
    <input id="bjName" placeholder="Usuario OF">

    <button onclick="bjAddPlaying()">➕ Add to Playing</button>
    <button onclick="bjAddWaiting()">➕ Add to Waiting</button>
  </div>

  <div class="bj-lists">
    <div class="bj-column">
      <div class="bj-column-title">Playing</div>
      <select id="bjPlayingList" class="bj-select" multiple></select>
      <button onclick="bjMoveToWaiting()">➜ To Waiting</button>
      <button onclick="bjRemoveFromPlaying()">🗑 Remove</button>
    </div>

    <div class="bj-column">
      <div class="bj-column-title">Waiting for Playing</div>
      <select id="bjWaitingList" class="bj-select" multiple></select>
      <button onclick="bjMoveToPlaying()">➜ To Playing</button>
      <button onclick="bjRemoveFromWaiting()">🗑 Remove</button>
    </div>
  </div>
</div>

<script>
  const MODEL_ID = "roman001";
  const API_URL = "/api/send";

  /* ========= NOMBRES RECIENTES (panel derecha) ========= */

  let recentNames = [];
  const MAX_NAMES = 30;

  function renderRecentNames() {
    const container = document.getElementById("names-list");
    if (!container) return;

    container.innerHTML = "";

    if (!recentNames.length) {
      const empty = document.createElement("div");
      empty.className = "names-empty";
      empty.textContent =
        "Aún no hay nombres. Envía un tip y aparecerán aquí.";
      container.appendChild(empty);
      return;
    }

    recentNames.forEach((name) => {
      const pill = document.createElement("span");
      pill.className = "name-pill";
      pill.textContent = name;
      pill.onclick = () => {
        const nameInput = document.getElementById("name");
        if (nameInput) nameInput.value = name;
      };
      container.appendChild(pill);
    });
  }

  function addRecentName(name) {
    const trimmed = (name || "").trim();
    if (!trimmed) return;

    const lower = trimmed.toLowerCase();
    recentNames = [trimmed, ...recentNames.filter((n) => n.toLowerCase() !== lower)];

    if (recentNames.length > MAX_NAMES) {
      recentNames.length = MAX_NAMES;
    }

    renderRecentNames();
  }

  function clearRecentNames() {
    recentNames = [];
    renderRecentNames();
  }

  // inicializar la vista de nombres al cargar (panel vacío + mensaje)
  renderRecentNames();

  /* ========= ENVIAR TIP / GOAL / TIMER ========= */

  function sendTip() {
    const nameInput = document.getElementById("name");
    const amountInput = document.getElementById("amount");

    if (!nameInput || !amountInput) {
      alert("Error interno: falta input.");
      return;
    }

    const name = nameInput.value.trim();
    const amount = Number(amountInput.value);

    if (!name || !amount) {
      alert("Debes escribir un nombre y un monto válido.");
      return;
    }

    // guardar en la lista de nombres recientes
    addRecentName(name);

    // mandar al backend
    sendToServer("tip", { name, amount });

    // limpiar solo el monto
    amountInput.value = "";
  }

  function clearAll() {
    sendToServer("clear");
    clearRecentNames();
  }

  function setGoal() {
    const goalInput = document.getElementById("goal");
    if (!goalInput) return;

    const goal = Number(goalInput.value);
    if (!goal || goal <= 0) {
      alert("La goal debe ser mayor a 0.");
      return;
    }
    sendToServer("setGoal", { goal });
  }

  function clearGoal() {
    sendToServer("clearGoal");
  }

  function startActionTimer(seconds) {
    sendToServer("actionTimer", { seconds });
  }

  function stopActionTimer() {
    sendToServer("actionTimerStop");
  }

  function sendToServer(type, payload = {}) {
    fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        modelId: MODEL_ID,
        type,
        payload,
      }),
    })
      .then((res) => {
        // si no devuelve JSON no rompemos nada
        if (!res.ok) {
          console.error("❌ Respuesta HTTP no OK:", res.status);
          return null;
        }
        const ct = res.headers.get("content-type") || "";
        if (!ct.includes("application/json")) return null;
        return res.json();
      })
      .then((data) => {
        if (data) console.log("Respuesta backend:", data);
      })
      .catch((err) => console.error("❌ Error en fetch:", err));
  }

  /* ========= BLACKJACK PLAYERS ========= */

  let bjPlaying = [];
  let bjWaiting = [];

  function bjSync() {
    bjRenderLists();
    sendToServer("blackjackPlayers", {
      playing: bjPlaying,
      waiting: bjWaiting,
    });
  }

  function bjRenderLists() {
    const playingSelect = document.getElementById("bjPlayingList");
    const waitingSelect = document.getElementById("bjWaitingList");
    if (!playingSelect || !waitingSelect) return;

    playingSelect.innerHTML = "";
    bjPlaying.forEach((name) => {
      const opt = document.createElement("option");
      opt.value = name;
      opt.textContent = name;
      playingSelect.appendChild(opt);
    });

    waitingSelect.innerHTML = "";
    bjWaiting.forEach((name) => {
      const opt = document.createElement("option");
      opt.value = name;
      opt.textContent = name;
      waitingSelect.appendChild(opt);
    });
  }

  function bjGetNameInput() {
    const input = document.getElementById("bjName");
    if (!input) return null;
    const name = input.value.trim();
    if (!name) {
      alert("Escribe un nombre primero.");
      return null;
    }
    return name;
  }

  function bjAddPlaying() {
    const name = bjGetNameInput();
    if (!name) return;

    if (!bjPlaying.includes(name)) {
      bjPlaying.push(name);
    }
    bjWaiting = bjWaiting.filter((n) => n !== name);

    bjSync();
  }

  function bjAddWaiting() {
    const name = bjGetNameInput();
    if (!name) return;

    if (!bjWaiting.includes(name) && !bjPlaying.includes(name)) {
      bjWaiting.push(name);
    }
    bjSync();
  }

  function bjMoveToWaiting() {
    const select = document.getElementById("bjPlayingList");
    if (!select) return;
    const selected = Array.from(select.selectedOptions).map((o) => o.value);
    if (!selected.length) return;

    bjPlaying = bjPlaying.filter((n) => !selected.includes(n));
    selected.forEach((name) => {
      if (!bjWaiting.includes(name)) bjWaiting.push(name);
    });

    bjSync();
  }

  function bjMoveToPlaying() {
    const select = document.getElementById("bjWaitingList");
    if (!select) return;
    const selected = Array.from(select.selectedOptions).map((o) => o.value);
    if (!selected.length) return;

    bjWaiting = bjWaiting.filter((n) => !selected.includes(n));
    selected.forEach((name) => {
      if (!bjPlaying.includes(name)) bjPlaying.push(name);
    });

    bjSync();
  }

  function bjRemoveFromPlaying() {
    const select = document.getElementById("bjPlayingList");
    if (!select) return;
    const selected = Array.from(select.selectedOptions).map((o) => o.value);
    if (!selected.length) return;

    bjPlaying = bjPlaying.filter((n) => !selected.includes(n));
    bjSync();
  }

  function bjRemoveFromWaiting() {
    const select = document.getElementById("bjWaitingList");
    if (!select) return;
    const selected = Array.from(select.selectedOptions).map((o) => o.value);
    if (!selected.length) return;

    bjWaiting = bjWaiting.filter((n) => !selected.includes(n));
    bjSync();
  }
</script>

</body>
</html>
